---
layout: page
title: Contact
permalink: /contact/
image: '/images/37.jpg'
---
{%- assign contact = site.data.settings.contact -%}
{%- if contact.description %}
<p>{{ contact.description }}</p>
{%- endif %}
<form class="form" action="{% if contact.email %}https://formspree.io/f/{{ contact.email }}{% else %}#{% endif %}" method="POST">
  <div class="form__field">
    <label for="form-name">Your name</label>
    <input id="form-name" type="text" name="name" autocomplete="name" required>
  </div>
  <div class="form__field">
    <label for="form-email">Your email</label>
    <input id="form-email" type="email" name="_replyto" autocomplete="email" required>
  </div>
  <div class="form__field">
    <label for="form-text">Message</label>
    <textarea id="form-text" name="text" rows="8" required></textarea>
  </div>
  <button class="button" type="submit">Send message</button>
</form>
