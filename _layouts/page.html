---
layout: default
---
<article class="page">
  <header class="wrap post__head">
    <div class="measure">
      <h1 class="post__title">{{ page.title }}</h1>
      {%- if page.description %}
      <p class="post__lede">{{ page.description }}</p>
      {%- endif %}
    </div>
  </header>

  {%- if page.image %}
  <figure class="wrap post__image post__image--page">
    {%- capture hero_img %}{% include image-url.html src=page.image w=1600 %}{% endcapture %}
    <img src="{{ site.baseurl }}{{ hero_img }}" alt="">
  </figure>
  {%- endif %}

  <div class="wrap">
    <div class="measure prose">
      {{ content }}
    </div>
  </div>
</article>
